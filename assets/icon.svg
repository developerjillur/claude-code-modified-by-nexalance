<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
  <!-- Stacked queue lines (3 rows, increasing offset) — recognizable as a queue icon -->
  <rect x="3" y="5"  width="14" height="3" rx="1.2"/>
  <rect x="5" y="10.5" width="14" height="3" rx="1.2"/>
  <rect x="3" y="16" width="14" height="3" rx="1.2"/>
  <!-- A small arrow on the right indicating dispatch direction -->
  <polyline points="20 6.5 22 6.5" opacity="0.5"/>
  <polyline points="20 12 22 12"  opacity="0.5"/>
  <polyline points="20 17.5 22 17.5" opacity="0.5"/>
</svg>
